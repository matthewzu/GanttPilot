name: Auto Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: GanttPilot ${{ github.ref_name }}
        body: |
          ## GanttPilot ${{ github.ref_name }}

          基于甘特图的协作式项目管理器 / Collaborative Project Manager with Gantt Chart

          ### 📥 下载 / Download

          | 平台 / Platform | 文件 / File | 使用方式 / Usage |
          | --- | --- | --- |
          | Windows | `GanttPilot.exe` | 双击运行 / Double-click to run |
          | macOS | `GanttPilot.dmg` | 打开 DMG 运行 / Open DMG |
          | Linux | `GanttPilot` | `chmod +x GanttPilot && ./GanttPilot` |

          CLI 模式 / CLI mode: `GanttPilot --cli`

          ### ✨ New in v1.13.2 / v1.13.2 修复

          - 🪟 **All Edit Dialogs Maximizable** — All create/edit dialogs (plan, milestone, requirement, task, project) now show maximize button on Windows / **所有编辑对话框支持最大化** — 所有创建/编辑对话框都显示最大化按钮

          ### ✨ New in v1.13.1 / v1.13.1 修复

          - 🪟 **Dialog Maximize Fix** — Removed `transient(parent)` from text-heavy dialogs so the maximize button appears on Windows / **弹窗最大化按钮修复** — 移除 transient 调用，Windows 上正确显示最大化按钮
          - 📋 **Push Content Detection** — Unpushed content summary now checks all project files and shows changed filenames / **推送内容检测增强** — 检测所有项目文件变更并显示文件名

          ### ✨ New in v1.13.0 / v1.13.0 新增

          - ✅ **Push Confirmation** — Manual push now shows a confirmation dialog listing what will be pushed (commit messages), preventing accidental pushes / **推送确认提示** — 手动推送前弹出确认对话框，展示待推送内容摘要
          - 📋 **Exit Push Content Summary** — Exit push prompt now displays the unpushed changes, so you know exactly what will be pushed / **退出推送内容展示** — 退出推送提示展示未推送的变更内容
          - 🔄 **Undo/Redo Git Sync** — Undo and Redo now create Git commits, so tree rollback is reflected in Git history / **Undo/Redo 同步 Git** — 撤销恢复同步创建 Git commit，历史标签页可见
          - 📝 **Non-Git Operation Logging** — Log file now records config changes, MCP server start/stop, and other non-Git events useful for debugging / **非 Git 操作日志** — 日志记录配置修改、MCP 启停等
          - 🪟 **Dialog Maximize** — Text-heavy dialogs (View Detail, Config, MCP, Project Edit, Activity Edit) now support window maximize for comfortable viewing and editing / **弹窗最大化** — 文本密集型对话框支持最大化

          ### ✨ New in v1.12.0 / v1.12.0 新增

          - 👥 **Project Members** — Define team members with name-to-abbreviation mapping at the project level (Edit Project → Members field, format `name:abbr`). When members are configured, the executor field becomes a dropdown list, preventing typo errors in abbreviations. Statistics remain based on abbreviations for backward compatibility / **项目成员管理** — 在项目级别配置成员名字与缩写对应关系，添加活动时执行者从下拉列表选择，避免缩写拼写错误

          ### ✨ New in v1.11.0 / v1.11.0 改进

          - 🧹 **Toolbar cleanup** — Infrequent buttons (language toggle, font size, update check, help, MCP) merged into "⚙ Config" and "⋯ More" menu, cleaner toolbar / **工具栏精简** — 不常用按钮合并到"⚙配置"和"⋯更多"菜单，界面更简洁
          - ⚙️ **Language & font in Config** — Language switch and font size now live in the Config dialog / **配置集成语言和字体** — 中英文切换和字体大小移入配置对话框
          - ⋯ **More popup menu** — New "⋯" button opens a menu with: check updates, help, MCP server, about / **更多菜单** — 新增"⋯"按钮，弹出菜单承载不常用功能
          - ✂️ **Cut button tooltip** — Cut button now shows "Cut (Ctrl+X)" tooltip on hover / **剪切按钮提示** — 剪切按钮添加 tooltip
          - 📅 **Activity date defaults to today** — Date field auto-fills with today's date when creating activities / **活动日期默认今天** — 创建活动时日期自动填充当天
          - 🔀 **Global branch switching** — Switching branches refreshes all views: project tree, Gantt, time stats, requirement tracking, and history / **分支切换全局化** — 切换分支同步刷新所有视图

          ### ✨ New in v1.10.3 / v1.10.3 改进

          - 🔄 **Remove auto-restart after update** — No more "Failed to load Python DLL" errors. Click OK to exit, then manually reopen / **取消自动重启** — 彻底解决更新后 DLL 加载失败

          ### ✨ New in v1.10.2 / v1.10.2 修复

          - 🔧 **"Upgrade Main Format" disappears after upgrade** — Menu now checks remote main's format (via git ls-tree) instead of local disk, so it correctly hides after main is upgraded even before private branch rebases / **升级后菜单正确消失** — 改为检查远端 main 格式而非本地磁盘

          ### ✨ New in v1.10.1 / v1.10.1 修复

          - 🔧 **Fix "Upgrade Main Format" not showing for v2→per-activity upgrade** — Menu now detects flat activity files and offers upgrade to per-activity format / **修复已拆分项目无法升级到 per-activity 格式** — 菜单现在检测 flat activity 文件并提供升级入口

          ### ✨ New in v1.10.0 / v1.10.0 新增

          - 📂 **Per-Activity File Storage** — Each activity is now stored as an individual file (`activities/{plan_id}/{activity_id}.json` + `_order.json`), virtually eliminating merge conflicts even when two people add activities to the same plan / **每条活动独立文件** — 即使同计划下多人添加活动也几乎不会冲突

          ### ✨ New in v1.9.4 / v1.9.4 修复

          - 🔀 **Fix data loss in squash-rebase** — Previous squash-rebase overwrote main's data with private branch data, losing other members' PR contributions. Now uses three-way data merge: main as base, apply only our actual changes (additions/edits relative to merge-base) / **修复 squash-rebase 数据丢失** — 旧逻辑用私有分支数据覆盖主线，丢失他人 PR 内容。改为三方数据合并：以主线为基础，仅应用相对于共同祖先的实际变更

          ### ✨ New in v1.9.3 / v1.9.3 修复

          - 🔀 **Squash-rebase for format migration** — When normal rebase fails due to format migration on main, automatically falls back to squash strategy: takes private branch's final data, converts to v2 format, commits as one on top of main. No manual conflict resolution needed / **格式迁移自动 squash-rebase** — 变基因格式差异冲突时自动采用 squash 策略，取私有分支最终数据转为 v2 格式提交，无需手动解决冲突

          ### ✨ New in v1.9.2 / v1.9.2 修复

          - 🔧 **Fix "Upgrade Main Format" not showing after failed attempt** — Detect partial migration residue (empty milestones/ dir) and still show the menu item / **修复失败后菜单项消失** — 检测残留的空目录，正确判断是否已迁移

          ### ✨ New in v1.9.1 / v1.9.1 修复

          - 🔧 **Fix migration prompt for remote projects** — No longer prompts on startup for collaborative projects; auto-migrates on rebase instead / **修复远程项目启动提示** — 多人协作项目不再弹窗，变基时自动迁移
          - 🔧 **Fix "Upgrade Main Format" error** — Perform migration directly on main branch instead of cherry-pick, avoiding conflicts / **修复升级主线格式报错** — 直接在主分支上执行迁移，避免冲突
          - 🔧 **Fix error on restart after failed migration** — Robust error handling for partial/corrupt split data / **修复迁移失败后重启报错** — 增强容错处理
          - 🔧 **Fix error when cancelling rebase prompt** — Fix lambda closure issue in error handler / **修复取消变基提示时报错**

          ### ✨ New in v1.9.0 / v1.9.0 新增

          - 📂 **v2 Fully-Split Storage Format** — Project data split into independent files (requirements, milestones, activities each in their own file), dramatically reducing Git merge conflicts in team collaboration / **v2 完全拆分存储格式** — 数据拆分为独立文件，大幅减少协作冲突
          - 🔄 **One-Click Main Branch Upgrade** — Maintainer right-click → "Upgrade Main Format", auto-migrates and pushes to main; team members auto-migrate on rebase / **一键升级主线格式** — 维护者右键操作，其他成员变基时自动跟随
          - 🔀 **Auto-Migrate on Rebase** — Detects new format on main and auto-migrates locally before rebase to avoid conflicts / **变基前自动格式迁移** — 避免格式差异导致冲突
          - 💡 **Migration Prompt for Local Projects** — Prompts local-only projects to upgrade on startup / **本地项目迁移提示** — 启动时检测并提示一键迁移
          - 🔄 **Full Backward Compatibility** — Transparently loads v0 (monolithic), v1 (activities split), and v2 (fully split) formats / **完全向后兼容** — 自动识别三种历史格式

          ### 🏗️ 核心能力 / Core Capabilities

          **项目管理 / Project Management**
          - 需求分析 → 任务拆解 → 里程碑规划 → 计划执行 → 活动记录，覆盖项目全生命周期
          - Full lifecycle: Requirements → Tasks → Milestones → Plans → Activities

          **甘特图 / Gantt Chart**
          - 原生 Canvas 渲染，按执行者着色，进度条，里程碑菱形标记，跳过日期红色斜线
          - Native rendering, per-executor coloring, progress bars, milestone markers, skip-date hatching

          **需求跟踪 / Requirement Tracking**
          - 计划关联任务，形成需求→任务→计划→进度完整跟踪链
          - 已完结计划显示工时差异（超出/少用），GUI 和报告保持一致
          - Link plans to tasks for full requirement → task → plan → progress traceability
          - Finished plans show hours variance (overtime/undertime), consistent between GUI and reports

          **工时管理 / Time Tracking**
          - 时间段（0900/1200,1400/1700）或直接填写小时数，按项目/里程碑/计划/标签四维统计
          - 已完结计划自动显示超出/少用工时差异（里程碑统计仅计算已完结计划）
          - 按项目查看模式显示项目级超出/少用工时汇总
          - Time slots or direct hours, 4 view modes: by project/milestone/plan/tag
          - Overtime/undertime display for finished plans (milestone stats only count finished plans)
          - Project-level overtime/undertime summary in "By Project" view

          **Git 协作 / Git Collaboration**
          - 每项目独立 Git 仓库，私有分支 + PR 工作流，后台自动检测远端更新
          - Per-project Git repos, private branches + PR workflow, background update detection

          **报告 / Reports**
          - Markdown 报告内嵌 PNG 甘特图（长项目自动分段），含需求分析、进度详情、工时明细、超出/少用统计
          - 导出文件名自动添加 _summary 或 _detail 后缀
          - Markdown reports with embedded PNG Gantt chart (auto-segmented for long projects), requirement analysis, progress details, overtime/undertime stats
          - Export filename auto-appends _summary or _detail suffix

          **效率工具 / Productivity**
          - 键盘快捷键（可自定义）、复制/剪切/粘贴/克隆、撤销/恢复、中英文双语
          - 剪切或粘贴时插入到选中节点后面，而非追加到末尾
          - Customizable shortcuts, copy/cut/paste/duplicate, undo/redo, bilingual (EN/ZH)
          - Cut/paste inserts after selected item, not at end

          **MCP Server (AI 集成 / AI Integration)**
          - 内置 MCP Server，支持 Kiro、Claude 等 AI 助手直接管理项目数据（25 个工具）
          - GUI 内一键启停 MCP 服务，提供 Kiro/Claude/通用配置模板一键复制
          - Built-in MCP Server allows AI assistants (Kiro, Claude, etc.) to manage project data (25 tools)
          - One-click start/stop in GUI, with copyable config templates for Kiro/Claude/Generic

          📖 详细文档 / Documentation: [README.md](https://github.com/${{ github.repository }})
        draft: false
        prerelease: false

  build-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: |
        pip install pyinstaller Pillow
        pyinstaller --onefile --windowed --name=GanttPilot --icon=ganttpilot.ico --add-data "ganttpilot.ico;." --add-data "examples;examples" --hidden-import PIL main.py
    - uses: softprops/action-gh-release@v1
      with:
        files: dist/GanttPilot.exe

  build-macos:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: |
        pip install pyinstaller Pillow
        pyinstaller --onefile --windowed --name=GanttPilot --add-data "ganttpilot.ico:." --add-data "examples:examples" --hidden-import PIL main.py
        mkdir dmg_temp
        cp dist/GanttPilot dmg_temp/
        hdiutil create -volname "GanttPilot" -srcfolder dmg_temp -ov -format UDZO GanttPilot.dmg
    - uses: softprops/action-gh-release@v1
      with:
        files: GanttPilot.dmg

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: |
        pip install pyinstaller Pillow
        pyinstaller --onefile --windowed --name=GanttPilot --icon=ganttpilot.ico --add-data "ganttpilot.ico:." --add-data "examples:examples" --hidden-import PIL main.py
    - uses: softprops/action-gh-release@v1
      with:
        files: dist/GanttPilot
