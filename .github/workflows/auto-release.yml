name: Auto Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: GanttPilot ${{ github.ref_name }}
        body: |
          ## GanttPilot ${{ github.ref_name }}

          基于甘特图的协作式项目管理器 / Collaborative Project Manager with Gantt Chart

          ### 📥 下载 / Download

          | 平台 / Platform | 文件 / File | 使用方式 / Usage |
          | --- | --- | --- |
          | Windows | `GanttPilot.exe` | 双击运行 / Double-click to run |
          | macOS | `GanttPilot.dmg` | 打开 DMG 运行 / Open DMG |
          | Linux | `GanttPilot` | `chmod +x GanttPilot && ./GanttPilot` |

          CLI 模式 / CLI mode: `GanttPilot --cli`

          ### ✨ v2.2.0 改进 / Improvements

          - 🔒 **Credential Local Storage** — Credentials no longer stored in project.json. Auto-migrates old projects / **Git 凭据本地化** — 凭据不再随仓库泄露，旧项目自动迁移
          - 🎛️ **Git Config Simplify** — Protocol-aware fields: SSH hides credentials; HTTPS hints they can be empty / **Git 配置简化** — SSH 隐藏凭据，HTTPS 提示可留空
          - 🎛️ **Collab Dialog Simplify** — Auto-fill committer from config; readonly auto-generated priv branch / **协作模式简化** — 提交者自动填充，私有分支自动生成

          ### 🏗️ 核心能力 / Core

          - 📊 需求→任务→里程碑→计划→活动，甘特图+仪表盘+工时统计+需求跟踪
          - 🔀 Git 协作：私有分支+PR 工作流，v2 拆分存储格式减少冲突
          - 📑 Markdown 报告（含目录+甘特图），MCP Server AI 集成
          - ⌨️ 快捷键+撤销恢复+复制粘贴+中英双语

          📖 [完整更新日志 / Full Changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
        draft: false
        prerelease: false

  build-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: |
        pip install pyinstaller Pillow customtkinter
        pyinstaller --onefile --windowed --name=GanttPilot --icon=ganttpilot.ico --add-data "ganttpilot.ico;." --add-data "examples;examples" --hidden-import PIL --hidden-import customtkinter --collect-data customtkinter main.py
    - uses: softprops/action-gh-release@v1
      with:
        files: dist/GanttPilot.exe

  build-macos:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: |
        pip install pyinstaller Pillow customtkinter
        pyinstaller --onefile --windowed --name=GanttPilot --add-data "ganttpilot.ico:." --add-data "examples:examples" --hidden-import PIL --hidden-import customtkinter --collect-data customtkinter main.py
        mkdir dmg_temp
        cp dist/GanttPilot dmg_temp/
        hdiutil create -volname "GanttPilot" -srcfolder dmg_temp -ov -format UDZO GanttPilot.dmg
    - uses: softprops/action-gh-release@v1
      with:
        files: GanttPilot.dmg

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: |
        pip install pyinstaller Pillow customtkinter
        pyinstaller --onefile --windowed --name=GanttPilot --icon=ganttpilot.ico --add-data "ganttpilot.ico:." --add-data "examples:examples" --hidden-import PIL --hidden-import customtkinter --collect-data customtkinter main.py
    - uses: softprops/action-gh-release@v1
      with:
        files: dist/GanttPilot
